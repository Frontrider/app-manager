services:
  php-site-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/site
        chown -R 1000:1000 /data/site
    volumes:
      - data:/data

  php-site:
    build:
      context: .
    image: localhost-php-server:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      php-site-init:
        condition: service_completed_successfully
    volumes:
      - type: volume
        source: data
        target: /var/www/html
        volume:
          subpath: site
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    labels:
      - "caddy=:90"
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.8_redir=/site /site/ permanent"
      - "caddy.8_handle_path=/site/*"
      - "caddy.8_handle_path.0_reverse_proxy={{upstreams 8080}}"
      - "caddy.8_handle_path.0_reverse_proxy.header_up=Accept-Encoding identity"

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
