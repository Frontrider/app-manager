services:
  data-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/games/openttd; chown 1000:1000 /data/games/openttd"]
    volumes:
      - data:/data

  openttd:
    depends_on:
      data-init:
        condition: service_completed_successfully
    build:
      context: .
    image: localhost-openttd:latest
    restart: unless-stopped
    env_file: env
    user: "1000:1000"
    command: ["/usr/games/openttd", "-D", "0.0.0.0:${SERVER_PORT:?Set SERVER_PORT in env}", "-c", "/data/openttd.cfg"]
    stdin_open: true
    tty: true
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.:${SERVER_PORT}.route.proxy={{upstreams ${SERVER_PORT}}}"
      - "caddy.layer4.udp/:${SERVER_PORT}.route.proxy=udp/{{upstreams ${SERVER_PORT}}}"
    volumes:
      - data:/Data
      - type: volume
        source: data
        target: /data
        volume:
          subpath: games/openttd
          nocopy: true

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
