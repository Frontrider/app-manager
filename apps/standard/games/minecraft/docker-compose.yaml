services:
  minecraft:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    env_file: env
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: "${TYPE:-VANILLA}"
      VERSION: "${VERSION:-LATEST}"
      MEMORY: "${MEMORY:-2G}"
      MOTD: "${MOTD:-Local Host Minecraft}"
      SERVER_PORT: "${SERVER_PORT:?Set SERVER_PORT in env}"
      UID: "1000"
      GID: "1000"
    stdin_open: true
    tty: true
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.:${SERVER_PORT:?Set SERVER_PORT in env}.route.proxy={{upstreams ${SERVER_PORT}}}"
    volumes:
      - minecraft_data:/data

volumes:
  minecraft_data:

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
