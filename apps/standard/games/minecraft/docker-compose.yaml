services:
  data-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/games/minecraft; chown 1000:1000 /data/games/minecraft"]
    volumes:
      - data:/data

  minecraft:
    depends_on:
      data-init:
        condition: service_completed_successfully
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    env_file: env
    environment:
      EULA: "${EULA:-FALSE}"
      TYPE: "${TYPE:-VANILLA}"
      VERSION: "${VERSION:-LATEST}"
      MEMORY: "${MEMORY:-2G}"
      MOTD: "${MOTD:-Local Host Minecraft}"
      SERVER_PORT: "${SERVER_PORT:?Set SERVER_PORT in env}"
      UID: "1000"
      GID: "1000"
    stdin_open: true
    tty: true
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.:${SERVER_PORT:?Set SERVER_PORT in env}.route.proxy={{upstreams ${SERVER_PORT}}}"
    volumes:
      - data:/Data
      - type: volume
        source: data
        target: /data
        volume:
          subpath: games/minecraft
          nocopy: true

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
