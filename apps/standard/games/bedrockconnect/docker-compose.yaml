services:
  bedrockconnect:
    build:
      context: .
    image: appstore-bedrockconnect:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: env
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.udp/:${SERVER_PORT:?Set SERVER_PORT in env}.route.proxy=udp/{{upstreams 19132}}"
    volumes:
      - bedrockconnect_data:/data

volumes:
  bedrockconnect_data:

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
