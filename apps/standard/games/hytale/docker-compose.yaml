services:
  hytale:
    image: deinfreu/hytale-server:latest
    restart: unless-stopped
    env_file: env
    environment:
      SERVER_IP: "${SERVER_IP:-0.0.0.0}"
      SERVER_PORT: "${SERVER_PORT:?Set SERVER_PORT in env}"
      JAVA_ARGS: "${JAVA_ARGS:--Xms1G -Xmx4G}"
      HYTALE_AUTH_MODE: "${AUTH_MODE:?Set AUTH_MODE in env}"
    stdin_open: true
    tty: true
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.udp/:${SERVER_PORT:?Set SERVER_PORT in env}.route.proxy=udp/{{upstreams ${SERVER_PORT}}}"
    volumes:
      - hytale_data:/home/container
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
        bind:
          create_host_path: false

volumes:
  hytale_data:

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
