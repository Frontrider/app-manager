services:
  data-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/games/openarena; chown 1000:1000 /data/games/openarena"]
    volumes:
      - data:/data

  openarena:
    depends_on:
      data-init:
        condition: service_completed_successfully
    build:
      context: .
    image: localhost-openarena:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: env
    command: ["/usr/games/openarena-server", "+set", "dedicated", "2", "+set", "fs_homepath", "/data", "+set", "net_port", "${SERVER_PORT:?Set SERVER_PORT in env}", "+map", "oa_dm1"]
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.udp/:${SERVER_PORT}.route.proxy=udp/{{upstreams ${SERVER_PORT}}}"
    volumes:
      - data:/Data
      - type: volume
        source: data
        target: /data
        volume:
          subpath: games/openarena
          nocopy: true

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
