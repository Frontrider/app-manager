services:
  data-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/games/ioquake3/baseq3; chown 1000:1000 /data/games/ioquake3 /data/games/ioquake3/baseq3"]
    volumes:
      - data:/data

  ioquake3:
    depends_on:
      data-init:
        condition: service_completed_successfully
    build:
      context: .
    image: localhost-ioquake3:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: env
    command: ["+set", "dedicated", "2", "+set", "fs_basepath", "/data", "+set", "fs_homepath", "/data", "+set", "net_port", "${SERVER_PORT:?Set SERVER_PORT in env}", "+map", "q3dm17"]
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.udp/:${SERVER_PORT}.route.proxy=udp/{{upstreams ${SERVER_PORT}}}"
    # Copy legally owned baseq3/*.pk3 into the shared volume's games/ioquake3 folder.
    # The engine image does not include proprietary game data.
    volumes:
      - data:/Data
      - type: volume
        source: data
        target: /data
        volume:
          subpath: games/ioquake3
          nocopy: true

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
