services:
  data-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/games/geysermc; chown 1000:1000 /data/games/geysermc"]
    volumes:
      - data:/data

  geysermc:
    depends_on:
      data-init:
        condition: service_completed_successfully
    build:
      context: .
    image: localhost-geysermc:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: env
    environment:
      JAVA_SERVER_HOST: "${JAVA_SERVER_HOST:?Set JAVA_SERVER_HOST in env}"
      JAVA_SERVER_PORT: "${JAVA_SERVER_PORT:?Set JAVA_SERVER_PORT in env}"
      AUTH_TYPE: "${AUTH_TYPE:?Set AUTH_TYPE in env}"
      SERVER_PORT: "${SERVER_PORT:?Set SERVER_PORT in env}"
    networks:
      - internal
    labels:
      - "caddy="
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.layer4.udp/:${SERVER_PORT:?Set SERVER_PORT in env}.route.proxy=udp/{{upstreams ${SERVER_PORT}}}"
    volumes:
      - data:/Data
      - type: volume
        source: data
        target: /data
        volume:
          subpath: games/geysermc
          nocopy: true

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
