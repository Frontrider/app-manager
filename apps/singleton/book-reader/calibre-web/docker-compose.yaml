services:
  calibre-web-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /Data/books /calibre-library /config/cache
        chown 1000:1000 /Data/books /Data/calibre-library
        chown -R 1000:1000 /config
        test -s /global-env/lldap_service_password
        install -m 600 -o 1000 -g 1000 /global-env/lldap_service_password /config/ldap-password
    volumes:
      - data:/Data
      - library:/calibre-library
      - calibre_config:/config
      - global-env:/global-env:ro

  calibre-web:
    build:
      context: .
    image: localhost-calibre-web-setup:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      calibre-web-init:
        condition: service_completed_successfully
    command: ["python", "/opt/localhost/setup.py", "--serve"]
    networks:
      - internal
    environment: &ldap
      LDAP_HOST: core
      LDAP_PORT: "3890"
      LDAP_USER_BASE_DN: "${LDAP_USER_BASE_DN:-ou=people,dc=example,dc=com}"
      LDAP_GROUP_BASE_DN: "${LDAP_GROUP_BASE_DN:-ou=groups,dc=example,dc=com}"
      COOKIE_PREFIX: localhost-calibre-
    volumes:
      - data:/Data
      - calibre_config:/config
      - global-env:/global-env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8083/login', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
    labels:
      caddy: ":90"
      caddy_ingress_network: "${CADDY_NETWORK:-localhost_internal}"
      caddy.11_redir: "/books /books/ permanent"
      caddy.11_handle_path: "/books/*"
      caddy.11_handle_path.reverse_proxy: "{{upstreams 8083}}"
      caddy.11_handle_path.reverse_proxy.header_up: "X-Script-Name /books"

  calibre-web-import:
    image: localhost-calibre-web-setup:latest
    restart: on-failure
    user: "1000:1000"
    depends_on:
      calibre-web:
        condition: service_healthy
    command: ["python", "/opt/localhost/importer.py"]
    networks:
      - internal
    environment: *ldap
    volumes:
      - data:/Data
      - calibre_config:/config

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"
  calibre_config:
    driver: local
  global-env:
    external: true
    name: "${GLOBAL_ENV_VOLUME:-localhost_global_env}"
  library:
    driver: local

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
