services:
  komga-init:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /data/books /config
        chown 1000:1000 /data/books
        chown -R 1000:1000 /config
    volumes:
      - data:/data
      - komga_config:/config

  komga-oidc-setup:
    build:
      context: .
    image: localhost-komga-setup:latest
    restart: "no"
    user: "0:0"
    command: ["python", "/oidc-setup.py"]
    depends_on:
      komga-init:
        condition: service_completed_successfully
    network_mode: none
    volumes:
      - komga_config:/config
      - global-env:/var/environment/global-env

  komga:
    image: gotson/komga:latest
    restart: always
    user: "1000:1000"
    depends_on:
      komga-init:
        condition: service_completed_successfully
      komga-oidc-setup:
        condition: service_completed_successfully
    environment:
      KOMGA_LIBRARIES_SCAN_STARTUP: "true"
      SERVER_SERVLET_CONTEXT_PATH: /books
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: localhost
      KOMGA_OAUTH2_ACCOUNT_CREATION: "true"
    networks:
      - internal
    labels:
      caddy: ':90'
      caddy_ingress_network: "${CADDY_NETWORK:-localhost_internal}"
      # Only the internal setup service may claim the bootstrap administrator.
      caddy.@komga_claim.path: '/books/api/v1/claim'
      caddy.6_redir: '/books /books/ permanent'
      caddy.6_handle: '/books/*'
      caddy.6_handle.0_respond: '@komga_claim Forbidden 403'
      caddy.6_handle.3_reverse_proxy: '{{upstreams 25600}}'
      caddy.6_handle.3_reverse_proxy.header_up: 'Accept-Encoding identity'
    volumes:
      - komga_config:/config
      - type: volume
        source: data
        target: /data/books
        read_only: true
        volume:
          subpath: books

  komga-library-setup:
    build:
      context: .
    image: localhost-komga-setup:latest
    restart: on-failure
    user: "0:0"
    depends_on:
      komga:
        condition: service_started
    networks:
      - internal
    environment:
      # Optional override for installations not bootstrapped by this app.
      KOMGA_API_KEY: "${KOMGA_API_KEY:-}"
      LDAP_URI: "${LDAP_URI:-ldap://core:3890}"
      LDAP_USER_BASE_DN: "${LDAP_USER_BASE_DN:-ou=people,dc=example,dc=com}"
      LDAP_GROUP_BASE_DN: "${LDAP_GROUP_BASE_DN:-ou=groups,dc=example,dc=com}"
    volumes:
      - komga_config:/config
      - global-env:/var/environment/global-env:ro

volumes:
  data:
    external: true
    name: "${DATA_VOLUME:-localhost_data}"
  komga_config:
    driver: local
  global-env:
    external: true
    name: "${GLOBAL_ENV_VOLUME:-localhost_global_env}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
