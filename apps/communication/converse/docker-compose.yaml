services:
  converse:
    build:
      context: .
    image: localhost-converse:latest
    restart: unless-stopped
    volumes:
      - global-env:/global-env:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
    labels:
      - "caddy=:90"
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.8_redir=/converse /converse/ permanent"
      - "caddy.8_handle_path=/converse/*"
      - "caddy.8_handle_path.0_reverse_proxy={{upstreams 8080}}"
      - "caddy.8_handle_path.0_reverse_proxy.header_up=Accept-Encoding identity"

volumes:
  global-env:
    external: true
    name: "${GLOBAL_ENV_VOLUME:-localhost_global_env}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
