services:
  ejabberd-init:
    image: ghcr.io/processone/ejabberd:latest
    restart: "no"
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /opt/ejabberd/database /opt/ejabberd/upload /opt/ejabberd/logs
        chown -R ejabberd:ejabberd /opt/ejabberd/database /opt/ejabberd/upload /opt/ejabberd/logs
    volumes:
      - ejabberd_database:/opt/ejabberd/database
      - ejabberd_upload:/opt/ejabberd/upload
      - ejabberd_logs:/opt/ejabberd/logs

  ejabberd-auth:
    build:
      context: .
      dockerfile: auth-proxy.Dockerfile
    image: localhost-ejabberd-auth:latest
    restart: unless-stopped
    depends_on:
      ejabberd:
        condition: service_healthy
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in env}"
    volumes:
      - global-env:/global-env:ro
    expose:
      - "8081"
    networks:
      - internal

  ejabberd:
    build:
      context: .
    image: localhost-ejabberd:latest
    restart: unless-stopped
    depends_on:
      ejabberd-init:
        condition: service_completed_successfully
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in env}"
    volumes:
      - ejabberd_database:/opt/ejabberd/database
      - ejabberd_upload:/opt/ejabberd/upload
      - ejabberd_logs:/opt/ejabberd/logs
      - global-env:/global-env:ro
    networks:
      - internal
    labels:
      - "caddy=:90"
      - "caddy_ingress_network=${CADDY_NETWORK:-localhost_internal}"
      - "caddy.1_redir=/ejabberd /ejabberd/admin/ permanent"
      - "caddy.2_redir=/ejabberd/ /ejabberd/admin/ permanent"
      - "caddy.3_redir=/ejabberd/admin /ejabberd/admin/ permanent"
      # The admin panel is restricted to LLDAP administrators. The auth proxy
      # adds ejabberd's own Basic Auth so the browser never prompts for it.
      - "caddy.@ejabberd_admin_denied.not.header_regexp=Remote-Groups (^|,)lldap_admin(,|$$)"
      - "caddy.7_handle=/ejabberd/admin/*"
      - "caddy.7_handle.0_forward_auth=127.0.0.1:9091"
      - "caddy.7_handle.0_forward_auth.uri=/auth/api/authz/forward-auth"
      - "caddy.7_handle.0_forward_auth.copy_headers=Remote-User Remote-Groups Remote-Name Remote-Email"
      # Keep the client Authorization header away from the forward-auth service.
      - "caddy.7_handle.0_forward_auth.header_up=-Authorization"
      - "caddy.7_handle.1_respond=@ejabberd_admin_denied Forbidden 403"
      - "caddy.7_handle.2_uri=strip_prefix /ejabberd"
      - "caddy.7_handle.3_reverse_proxy={{upstreams 8081}}"
      - "caddy.7_handle.3_reverse_proxy.header_up=Accept-Encoding identity"
      # XMPP clients use these endpoints directly, so they cannot require forward auth.
      - "caddy.8_handle_path=/ejabberd/*"
      - "caddy.8_handle_path.0_reverse_proxy={{upstreams 5280}}"
      - "caddy.8_handle_path.0_reverse_proxy.header_up=Accept-Encoding identity"
      # The core Caddy container must expose TCP 5222 (clients) and 5269 (federation).
      - "caddy_1="
      - "caddy_1.layer4.:5222.route.proxy={{upstreams 5222}}"
      - "caddy_1.layer4.:5269.route.proxy={{upstreams 5269}}"

volumes:
  ejabberd_database:
    driver: local
  ejabberd_upload:
    driver: local
  ejabberd_logs:
    driver: local
  global-env:
    external: true
    name: "${GLOBAL_ENV_VOLUME:-localhost_global_env}"

networks:
  internal:
    external: true
    name: "${CADDY_NETWORK:-localhost_internal}"
