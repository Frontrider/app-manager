name: Release Docker image

on:
  release:
    types: [published]
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version to publish (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: docker-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="$RELEASE_TAG"
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'; then
            echo "Use a semantic version such as 1.2.3 or 1.2.3-rc.1. Build metadata is not supported in Docker tags." >&2
            exit 1
          fi
          if [ "${#version}" -gt 128 ]; then
            echo "Docker image tags cannot exceed 128 characters." >&2
            exit 1
          fi
          docker build --pull --file Dockerfile --tag "$image:$version" .
          docker push "$image:$version"
          printf 'name=%s\nversion=%s\ntag=%s\n' "$image:$version" "$version" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          notes="Docker image: \`$IMAGE\`

          Pull with:
          \`\`\`sh
          docker pull $IMAGE
          \`\`\`"
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .tag_name")"
          if [ -n "$existing" ]; then
            body="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
            if [[ "$body" != *"Docker image: \`$IMAGE\`"* ]]; then
              gh release edit "$RELEASE_TAG" --notes "${body}${body:+$'\n\n'}$notes"
            fi
          else
            arguments=(--target "$COMMIT" --title "$RELEASE_TAG" --notes "$notes")
            if [[ "$VERSION" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${arguments[@]}"
          fi
          printf 'Published Docker image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
