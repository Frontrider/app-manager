name: Release Docker image

on:
  release:
    types: [published]
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version to publish (e.g. 1.2.3 or 1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.architecture }} image
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    outputs:
      name: ${{ steps.image.outputs.name }}
      amd64: ${{ steps.image.outputs.amd64 }}
      arm64: ${{ steps.image.outputs.arm64 }}
      version: ${{ steps.image.outputs.version }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish application image
        id: image
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          image="ghcr.io/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="$RELEASE_TAG"
          if ! printf '%s\n' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'; then
            echo "Use a semantic version such as 1.2.3 or 1.2.3-rc.1. Build metadata is not supported in Docker tags." >&2
            exit 1
          fi
          if [ "${#version}" -gt 122 ]; then
            echo "Version cannot exceed 122 characters so architecture tags fit Docker's 128-character limit." >&2
            exit 1
          fi
          docker buildx build --pull --platform "linux/$ARCHITECTURE" \
            --file Dockerfile --tag "$image:$version-$ARCHITECTURE" --push .
          printf 'name=%s\namd64=%s\narm64=%s\nversion=%s\ntag=%s\n' \
            "$image:$version" "$image:$version-amd64" "$image:$version-arm64" \
            "$version" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-architecture image
        env:
          IMAGE: ${{ needs.build.outputs.name }}
          AMD64_IMAGE: ${{ needs.build.outputs.amd64 }}
          ARM64_IMAGE: ${{ needs.build.outputs.arm64 }}
        run: |
          docker buildx imagetools create --tag "$IMAGE" \
            "$AMD64_IMAGE" "$ARM64_IMAGE"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          IMAGE: ${{ needs.build.outputs.name }}
          AMD64_IMAGE: ${{ needs.build.outputs.amd64 }}
          ARM64_IMAGE: ${{ needs.build.outputs.arm64 }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          notes="## Docker images

          | Platform | Image |
          | --- | --- |
          | Automatic (AMD64 / ARM64) | \`$IMAGE\` |
          | AMD64 | \`$AMD64_IMAGE\` |
          | ARM64 | \`$ARM64_IMAGE\` |

          Pull with:
          \`\`\`sh
          docker pull $IMAGE
          docker pull $AMD64_IMAGE
          docker pull $ARM64_IMAGE
          \`\`\`"
          existing="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .tag_name")"
          if [ -n "$existing" ]; then
            body="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
            if [[ "$body" != *"$notes"* ]]; then
              gh release edit "$RELEASE_TAG" --notes "${body}${body:+$'\n\n'}$notes"
            fi
          else
            arguments=(--target "$COMMIT" --title "$RELEASE_TAG" --generate-notes --notes "$notes")
            if [[ "$VERSION" == *-* ]]; then
              arguments+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${arguments[@]}"
          fi
          printf '%s\n' "$notes" >> "$GITHUB_STEP_SUMMARY"
